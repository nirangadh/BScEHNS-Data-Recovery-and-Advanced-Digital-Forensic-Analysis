<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d" font-family="Open Sans, Segoe UI, Roboto, Calibri, sans-serif">
  <title id="t">How a stretched picture closes up when it is seen from the side</title>
  <desc id="d">Left: a framed picture seen from the front, with a long stretched grey shape across its lower edge. Right: the same shape seen from the edge of the frame, where it closes up into a skull.</desc>
  <rect width="720" height="300" fill="#F7F8F4"/>
  <text x="200" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#31423B">Seen from the front</text>
  <rect x="40" y="40" width="320" height="210" fill="#FFFFFF" stroke="#4F6356" stroke-width="6"/>
  <rect x="95" y="70" width="40" height="110" rx="18" fill="#DCE6DE" stroke="#6E8472" stroke-width="2"/>
  <rect x="265" y="70" width="40" height="110" rx="18" fill="#DCE6DE" stroke="#6E8472" stroke-width="2"/>
  <rect x="150" y="110" width="100" height="70" fill="#E8F0EA" stroke="#6E8472" stroke-width="2"/>
  <line x1="52" y1="182" x2="348" y2="182" stroke="#CBD6CE" stroke-width="2"/>
  <g transform="translate(200 214) rotate(-12) scale(4.6 0.5)">
    <ellipse cx="0" cy="-6" rx="24" ry="26" fill="#5C6B63"/>
    <rect x="-13" y="14" width="26" height="16" rx="4" fill="#5C6B63"/>
    <ellipse cx="-9" cy="-4" rx="6" ry="7" fill="#FFFFFF"/>
    <ellipse cx="9" cy="-4" rx="6" ry="7" fill="#FFFFFF"/>
    <path d="M0 6 l-3 7 h6 z" fill="#FFFFFF"/>
  </g>
  <text x="200" y="278" text-anchor="middle" font-size="13" fill="#5C6B63">A long grey smear lies across the floor.</text>
  <path d="M385 150 h60" stroke="#8A4E8F" stroke-width="3" fill="none"/>
  <path d="M445 150 l-10 -7 v14 z" fill="#8A4E8F"/>
  <text x="560" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#31423B">Seen from the right-hand edge</text>
  <path d="M500 60 L620 40 L620 250 L500 230 Z" fill="#FFFFFF" stroke="#4F6356" stroke-width="6" stroke-linejoin="round"/>
  <line x1="505" y1="176" x2="616" y2="186" stroke="#CBD6CE" stroke-width="2"/>
  <g transform="translate(560 208) scale(0.95)">
    <ellipse cx="0" cy="-6" rx="24" ry="26" fill="#5C6B63"/>
    <rect x="-13" y="14" width="26" height="16" rx="4" fill="#5C6B63"/>
    <ellipse cx="-9" cy="-4" rx="6" ry="7" fill="#FFFFFF"/>
    <ellipse cx="9" cy="-4" rx="6" ry="7" fill="#FFFFFF"/>
    <path d="M0 6 l-3 7 h6 z" fill="#FFFFFF"/>
  </g>
  <circle cx="676" cy="150" r="9" fill="#8A4E8F"/>
  <path d="M667 150 L628 132 M667 150 L628 168" stroke="#8A4E8F" stroke-width="2" fill="none"/>
  <text x="560" y="278" text-anchor="middle" font-size="13" fill="#5C6B63">From here the smear closes up into a skull.</text>
</svg>
