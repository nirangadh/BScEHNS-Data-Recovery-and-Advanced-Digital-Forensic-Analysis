# _data/glossary/s07.yml - the words first taught in Session 7 (network evidence and exfiltration).
# What a capture holds
packet-capture:
  term: "packet capture"
  def: "A file that holds copies of the packets that passed one point of a network, each with the time at which it was copied."
packet:
  term: "packet"
  def: "One small unit of data that travels across a network, made of addressing information followed by the data it carries."
packet-header:
  term: "packet header"
  def: "The front part that one layer adds to a packet, holding that layer's addresses and control values."
protocol:
  term: "protocol"
  def: "An agreed set of rules for how two computers exchange data, such as the rules for web pages or for email."
frame:
  term: "frame"
  def: "A packet as it travels on one local network, wrapped with the hardware addresses of the sender and the receiver on that network."
mac-address:
  term: "MAC address"
  def: "The hardware address of a network adapter, written as six pairs of hexadecimal digits. It is used only inside one local network."
ip-address:
  term: "IP address"
  def: "The number that a network gives to a device so that packets can be delivered to it across networks."
port:
  term: "port"
  def: "A number from 0 to 65,535 that shows which program on a computer a packet is meant for."
tcp:
  term: "TCP"
  def: "The transport protocol that sets up a connection, numbers the data and sends lost pieces again, so that everything arrives in order."
udp:
  term: "UDP"
  def: "The transport protocol that sends single messages with no connection, no numbering and no repeat."
# Where it was taken
capture-point:
  term: "capture point"
  def: "The place in a network where traffic is copied for a packet capture. Only traffic that passes this place can be in the capture."
port-mirroring:
  term: "port mirroring"
  def: "A switch function that sends a copy of the traffic of chosen ports to one other port for monitoring. It is widely known as SPAN."
network-tap:
  term: "network TAP"
  def: "A hardware device placed in a network cable that copies every signal on the cable to separate monitoring outputs."
dropped-packet:
  term: "dropped packet"
  def: "A packet that passed the capture point and is missing from the capture, because the copying device or the recording computer could not keep up."
# From packets to files
stream:
  term: "stream"
  def: "The data of one TCP connection in the order in which it was sent, after the packets have been put back together."
conversation:
  term: "conversation"
  def: "All the traffic between two endpoints in a capture. It is the word that Wireshark uses in its statistics."
reassembly:
  term: "reassembly"
  def: "Putting the data of many packets back into the order in which it was sent, and removing pieces that arrived twice."
display-filter:
  term: "display filter"
  def: "A rule typed into Wireshark that shows only the packets that match it and hides the others without deleting them."
# Flow records
flow:
  term: "flow"
  def: "All the packets that share the same source address, destination address, source port, destination port and protocol."
flow-record:
  term: "flow record"
  def: "One line that summarises a flow: the addresses, ports and protocol, the first and last time, and the number of packets and bytes."
netflow:
  term: "NetFlow"
  def: "The format for flow records that the company Cisco introduced. Many routers and tools can produce and read it."
ipfix:
  term: "IPFIX"
  def: "The open internet standard for flow records, developed from NetFlow version 9."
# Encrypted traffic
tls:
  term: "TLS"
  def: "Transport Layer Security, the protocol that encrypts most web and mail traffic between a program and a server."
handshake:
  term: "handshake"
  def: "The opening exchange of a connection, in which the two sides agree how they will talk before any content is sent."
server-name-indication:
  term: "server name indication"
  def: "The field in the first TLS message in which a program names the site that it wants to reach. It is written as SNI."
certificate:
  term: "certificate"
  def: "A signed electronic document with which a server shows who it is. It names the site, the organisation that issued it and the dates between which it is valid."
encrypted-client-hello:
  term: "Encrypted Client Hello"
  def: "An addition to TLS 1.3 that encrypts the name of the site in the first message, so that an observer sees only a name shared by many sites."
# Exfiltration and attribution
exfiltration:
  term: "exfiltration"
  def: "Moving data out of an organisation without permission."
dns:
  term: "DNS"
  def: "The Domain Name System, the service that turns a name such as www.example.com into an IP address."
dns-query:
  term: "DNS query"
  def: "One question that a computer sends to the Domain Name System about one name."
dns-tunnelling:
  term: "DNS tunnelling"
  def: "Hiding other data inside DNS queries and answers, so that it leaves or enters a network through the name service."
attribution:
  term: "attribution"
  def: "Deciding which device, which account or which person was responsible for an action, and showing the evidence for each step of that decision."
